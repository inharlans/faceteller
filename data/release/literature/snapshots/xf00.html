<div class="mw-content-ltr mw-parser-output" dir="ltr" lang="zh"><p>今之游夫術子以宅墓，祿命、形相三事，致道吉凶、卑榮。王<a class="extiw" href="https://zh.wiktionary.org/wiki/%E7%9F%A6" title="wikt:矦">矦</a>百官之門，日無虛者。聽其言也，則<a class="extiw" href="https://zh.wiktionary.org/wiki/%E4%BA%B9%E4%BA%B9" title="wikt:亹亹">亹亹</a>昭昭，明根曲據，若銖毫無爽矣。而率皆無<a class="extiw" href="https://zh.wiktionary.org/wiki/%E9%A8%90" title="wikt:騐">騐</a>，要之三事，唯形相人各判殊，可以案察推。取神斯理者，當揚目而洞<a class="extiw" href="https://zh.wiktionary.org/wiki/%E8%A6%A9" title="wikt:覩">覩</a>也。
</p><p>國朝永樂間，盛稱柳莊、袁生，百無一謬。而其精奧，竟鮮有傳之者。
</p><p>余家有古刻相法十六篇，<a class="extiw" href="https://zh.wiktionary.org/wiki/%E5%BB%BC" title="wikt:廼">廼</a>高陽許負所撰。且云許負者，即漢文帝令相鄧通者也。
</p><p>然通傳不載負名，而相通之訣則著於負篇矣。
</p><p>余誦其文，雖多後世增色，而古朴簡要，非漢代莫有也。嘗取一二，私自鏡別，則往往靈中可愕。即雜渾群述，後世無以持其領旨。乃別錄之，倘山澤之英有好之者，則舉以贈也。
</p><p><br/>
<b>五獄山人黃省曾撰</b>
