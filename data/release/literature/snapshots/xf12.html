<p>脚下龜理紋，主二千石祿位。<br/>
君子之相。脚下容龜。三公封侯。<br/>
脚下理長。位至公王。（有相理紋者好）<br/>
通心達理，三公刺史之位。<br/>
脚心黑紫，祿至二千石。<br/>
脚下三理紋，公王將相位。<br/>
脚下無文，法主寒貧。<br/>
足薄而指長，之子沒兒郎?<br/>
足中指長，客死他鄉。<br/>
足蹈齊短，為人安穩。<br/>
脚骨節強，妨非一雨。兼主辛苦。<br/>
足厚四寸，必主大祿，富貴人也。
</p>
