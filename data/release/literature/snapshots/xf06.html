<p>口如角弓，位至三公。<br/>
口如含丹，不受饑寒。一則主富，一則主官。<br/>
口如撮聚，供承人後。虛用心情，人賤如狗。<br/>
口如縮囊，饑死無糧。縱然有子，必主別房。<br/>
口如吹火，饑寒獨坐。<br/>
口如縮螺，常樂獨謌。<br/>
龍唇鳳口，不可為友。好說不真，常懷麄醜。<br/>
口如赤丹，不入殷蘭。若是女子，亦得夫憐。<br/>
口闊舌薄，必好歌樂。如此之人，永無凶惡。<br/>
縱理入口，饑死不久。<br/>
口邊紫色，貪財妨害。<br/>
口開齒出，當失筭數。必不久長，少即身故。<br/>
口中有理，長相對益。豐財足祿，終無妨害。<br/>
口未語，將唇起，奸邪在心，常懷不足。<br/>
口如馬口，𡝢害貪醜。<br/>
口中黑子，貪噉皆美。
</p>
