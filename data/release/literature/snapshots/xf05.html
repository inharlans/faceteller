<p>下唇過上唇，妨夫的有真。 <br/>
上唇過下唇，法多虛假人。 <br/>
唇紫色，足衣食。 <br/>
唇常赤，為貴客。 <br/>
上唇厚，命非久。 <br/>
下唇長，主貪食。 <br/>
唇上下相當，語音易善。好集文章。 <br/>
女唇紫，夫早死，兼妨首子。 <br/>
唇赤如丹，不要師看。 <br/>
唇上下不相覆，常懷盜竊，終身不富。 <br/>
唇多紋理，兒多無比。
</p>
