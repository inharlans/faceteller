<p>鼻准洪直，富貴無極。 <br/>
鼻狹高危，兄弟微羸。 <br/>
鼻梁不直，欺詐未息。 <br/>
鼻毛出外，誹謗凶害。 <br/>
鼻上黑子，疾在陰里。 <br/>
鼻有縱理，主養他子。 <br/>
鼻上橫理，憂危不已。 <br/>
若是胡人，富貴如市。 <br/>
鼻柱不平，委的他姓。 <br/>
鼻柱薄，立志弱。 <br/>
鼻如縮囊，至老吉昌。 <br/>
鼻如獅子，聰明達士。 <br/>
鼻高而昂，仕宦欣昌。 <br/>
鼻上光澤，富貴盈宅。 <br/>
鼻如截筒，富貴興隆。 <br/>
鼻起中央，車馬敗傷。 <br/>
鼻頭短小，意志淺小。 <br/>
鼻相廣長，必多伎倆。 <br/>
鼻直而厚，天子諸侯。 <br/>
鼻如缺破，孤獨飢餓。
</p>
