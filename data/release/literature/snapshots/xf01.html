<p>目秀而長，必近君王。 <br/>
龍睛鳳目，必食重祿。 <br/>
目如臥弓，必是奸雄。 <br/>
鬥雞蜂目，惡死孤獨。 <br/>
目光如電，貴不可言。 <br/>
目尾朝天，福祿綿綿。 <br/>
女目四白，外夫入宅。 <br/>
目色通黃，慈憫忠良。 <br/>
黑白分明，必主朝京。若是女子，的主廉貞。 <br/>
目白長細，貧寒無計。 <br/>
目中赤砂起，法死須妨已。 <br/>
女人目下赤色，必憂產厄。 <br/>
目下一字平，所作皆分明。 <br/>
目下亂理紋，室家多子孫。 <br/>
目下有臥蠶，足女還少男。 <br/>
目下光漫亂，奸淫須少喚。 <br/>
右目小，女畏夫。左目小，男畏婦。隨其男女，小心不虛。<br/>
目長一寸，五分刀筆，五分凌雲。
</p>
