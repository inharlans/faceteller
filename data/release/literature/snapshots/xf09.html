<p>胸狹面長，不可求望。 <br/>
胸廣而長，主得公王。 <br/>
胸短於面，法主鄙賤。 <br/>
胸上黑紫，為兵萬里。 <br/>
胸獨高起，貧賤不已。 <br/>
胸若覆身，富貴名真。 <br/>
胸不平均，未足為人。 <br/>
胸均平滿，豪播天畔。 <br/>
胸有毫毛，必主富豪。（十毫以下，三毫以上，必主長命。若多毛主者，亦主貧賤。精長而出，即為第一也。）  <br/>
胸廣而方，長智榮昌。
</p>
