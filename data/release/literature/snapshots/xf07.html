<p>齒白如玉，自然謌樂。財食自至，不用苦作。<br/>
齒如斬銀，必是貴人。<br/>
齒如石橊，富貴他求。<br/>
齒如龍齒，法生貴子。<br/>
齒齦竅出，每事漏失。<br/>
齒縫踈稀，財食無餘。如此之人，與鬼同居。<br/>
齒數三十六，貴聖有天祿。<br/>
若三十向上，富貴豪望。<br/>
足滿三十，衣食自如。<br/>
齒色黑，多妨克。<br/>
三十以下，漸多饑寒。衣食必少，壽命短促。
</p>
