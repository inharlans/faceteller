<p>舌小窄方，法主公王。<br/>
舌上長理，三公可擬。<br/>
舌小多紋理，安樂常不已。<br/>
舌至鼻頭，必得封侯。<br/>
舌長而薄，萬事虛耗。<br/>
舌大口小，言不了了。<br/>
舌小口大，言語捷快。<br/>
舌過粗大，主多饑餓。<br/>
舌小而短，法主貧賤。<br/>
舌上黑紫，必無終始。<br/>
口語未出，其舌先見。好語他事，必自改變。<br/>
舌上綉文，奴馬成群。財帛千萬，富貴凌雲。<br/>
舌有支理紋，富貴必超升。
</p>
