<p>耳高於目，合受他祿。 （作為人師也）<br/>
高於眉一寸，永不踐貧困。 <br/>
耳高輪廓，亦主安樂。 <br/>
耳有刀環，五等高官。 <br/>
耳門垂厚，富貴長久。 <br/>
耳門容筋，家貧易去。 <br/>
耳有毫毛，長壽富貴，兼沒災殃。（毛若目能自見者吉。）<br/>
耳如獸耳，自安自止。 <br/>
耳門寬大，聰明財足。<br/>
耳門薄小，命短食少。 <br/>
耳白於面，名滿赤縣。
</p>
