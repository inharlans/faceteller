<p>手紋亂挫，合有福祿，永無災害。 <br/>
手有橫理紋，殺害不須論。 <br/>
手有縱橫紋，爵位至三公。 <br/>
黑子掌中，財食無窮。 <br/>
黑子手裡，多婦少兒。 <br/>
掌四方，厚中央。薄兼有深，法益仕宦，財食安樂。 <br/>
掌通四起，容止君子。 <br/>
手有仰羊，行不衣糧。（手中有仰羊者，即難得也。）<br/>
手有三的約，必使奴僕。（指上紋有三行，各三道者是也。）<br/>
手一約，必為奴走腳。或作客，兼貧無福。 <br/>
十指三約並通，財食無窮。 <br/>
手如虎屈，貧寒至骨。 <br/>
手如瓶瓦，必作大富。 <br/>
長者爪忽缺落，厄病數著。 <br/>
若似龍虎，貴名難得。 <br/>
龍龜紅直，必得官職。 <br/>
男手如旡囊，祿位似公王。（上相人若庶人，各富貴也。）<br/>
女手竹竿槍，福祿至無疆。
</p>
